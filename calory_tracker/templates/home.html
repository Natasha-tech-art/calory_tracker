<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-3xl mx-auto mt-10 bg-white p-6 rounded-lg shadow">

    <h1 class="text-3xl font-bold mb-6 text-center">
        Calorie Counter
    </h1>

    <form method="POST" class="mb-6">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <input
                type="text"
                name="name"
                placeholder="Food name"
                required
                class="border p-3 rounded"
            >

            <input
                type="number"
                name="calories"
                placeholder="Calories"
                required
                class="border p-3 rounded"
            >

        </div>

        <button
            type="submit"
            class="mt-4 bg-blue-500 text-white px-6 py-2 rounded"
        >
            Add Food
        </button>
    </form>

    <div class="mb-4">
        <h2 class="text-xl font-semibold">
            Total Calories:
            <span class="text-red-500">
                {{ total_calories }}
            </span>
        </h2>
    </div>

    <div class="space-y-3">

        {% for food in foods %}
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded">

            <div>
                <h3 class="font-bold">{{ food.name }}</h3>
                <p>{{ food.calories }} calories</p>
            </div>

            <a
                href="{% url 'delete_food' food.id %}"
                class="bg-red-500 text-white px-4 py-2 rounded"
            >
                Delete
            </a>

        </div>
        {% endfor %}

    </div>

    <a
        href="{% url 'reset_calories' %}"
        class="inline-block mt-6 bg-black text-white px-6 py-2 rounded"
    >
        Reset All
    </a>

</div>

</body>
</html>
